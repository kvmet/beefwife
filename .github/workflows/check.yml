name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  library:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # pixi.js 8 dereferences a bare `navigator` when it loads, and that
      # global arrived in Node 21, so anything importing the peer needs 22.
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: DeLaGuardo/setup-clojure@13
        with:
          bb: latest
      - run: npm ci --prefix beefwife
      - run: npm ci --prefix beefwife-canvas
      - run: npm ci --prefix terrain
      - run: bb test
      - run: bb terrain
      - run: bb beefwife-build
      # The browser artifacts are committed, so a stale one is a defect.
      - name: committed artifacts match source
        run: git diff --exit-code

  # Terrain depends on nothing, so its floor sits below the matrix above and
  # needs its own job to stay honest.
  terrain-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: DeLaGuardo/setup-clojure@13
        with:
          bb: latest
      - run: npm ci --prefix terrain
      - run: bb terrain

  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci --prefix beefwife-lab
      - run: npm --prefix beefwife-lab run check
