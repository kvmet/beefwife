<!doctype html>
<meta charset="utf-8" />
<title>Pixi renderer lifetime regression</title>
<p>
  Serve the repository root over HTTP and open this page. Add ?gpu=webgl to
  compare WebGL with WebGPU. This test uses native Pixi meshes.
</p>
<pre id="results">Running</pre>
<script src="../../beefwife/node_modules/pixi.js/dist/pixi.js"></script>
<script type="module">
  const output = document.querySelector("#results");
  const preference = new URLSearchParams(location.search).get("gpu") ?? "webgpu";
  const checkpoints = [];
  const app = new PIXI.Application();
  const second = new PIXI.Application();
  try {
    if (preference !== "webgpu" && preference !== "webgl")
      throw new Error(`Unknown GPU preference: ${preference}`);
    await app.init({ width: 64, height: 64, preference, autoStart: false });
    const expected = preference === "webgpu"
      ? PIXI.RendererType.WEBGPU
      : PIXI.RendererType.WEBGL;
    if (app.renderer.type !== expected)
      throw new Error(`First renderer did not use ${preference}`);
    const geometry = new PIXI.MeshGeometry({
      positions: new Float32Array([0, 0, 64, 0, 0, 64]),
      indices: new Uint32Array([0, 1, 2]),
    });
    geometry.batchMode = "no-batch";
    const mesh = new PIXI.Mesh({ geometry, texture: PIXI.Texture.WHITE });
    app.stage.addChild(mesh);
    document.body.append(app.canvas);
    app.render();
    checkpoints.push("First mesh rendered");
    await second.init({ width: 64, height: 64, preference, autoStart: false });
    if (second.renderer.type !== expected)
      throw new Error(`Second renderer did not use ${preference}`);
    second.destroy({ removeView: true, releaseGlobalResources: false });
    checkpoints.push("Second renderer destroyed");
    app.render();
    checkpoints.push("First mesh rendered after second renderer destruction");
    mesh.blendMode = "add";
    app.render();
    checkpoints.push("First mesh rendered with a new blend mode");
    output.textContent = `PASS Pixi ${PIXI.VERSION} ${preference}\n${checkpoints.join("\n")}`;
  } catch (error) {
    output.textContent = `FAIL Pixi ${PIXI.VERSION} ${preference}\n${checkpoints.join("\n")}\n${error.stack}`;
    console.error(error);
  }
</script>
