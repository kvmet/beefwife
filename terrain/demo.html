<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Terrain demo</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: #f5f2ea;
        color: #25241f;
        font: 16px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 420px;
        overflow: hidden;
        box-shadow: inset 0 0 0 var(--edge-margin, 0) #ffb554;
        touch-action: none;
      }
      header {
        position: absolute;
        z-index: 3;
        top: 24px;
        left: 24px;
        max-width: 30rem;
        pointer-events: none;
      }
      h1 { margin: 0 0 4px; font-size: 20px; }
      p { margin: 0; color: #6f6a5d; }
      #profile {
        position: absolute;
        z-index: 3;
        top: 24px;
        right: 24px;
        display: grid;
        justify-items: end;
        gap: 10px;
      }
      button {
        border: 2px solid #25241f;
        padding: 8px 12px;
        background: #f5f2ea;
        color: inherit;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #fff; }
      button:disabled { cursor: wait; opacity: 0.65; }
      output {
        min-height: 4.2em;
        color: #6f6a5d;
        font-size: 13px;
        text-align: right;
        white-space: pre;
      }
      [data-terrain-avoid] {
        position: absolute;
        display: grid;
        place-items: center;
        border: 2px solid #25241f;
        background: #ffb554;
        box-shadow: 6px 6px 0 #25241f;
        font-weight: 700;
      }
      .one { top: 18%; left: 42%; width: 18%; height: 32%; }
      .two { right: 9%; bottom: 16%; width: 24%; height: 18%; }
      .three { left: 18%; bottom: 12%; width: 13%; height: 29%; }
      .four { top: 15%; right: 18%; width: 10%; height: 13%; }
      .five { top: 58%; left: 33%; width: 13%; height: 11%; }
      .six { right: 38%; bottom: 8%; width: 10%; height: 18%; }
      canvas {
        position: absolute;
        z-index: 1;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #actor {
        position: absolute;
        z-index: 2;
        width: 14px;
        height: 14px;
        margin: -7px;
        border: 3px solid #f5f2ea;
        border-radius: 50%;
        background: #087f5b;
        box-shadow: 0 0 0 2px #087f5b;
        pointer-events: none;
      }
      @media (max-width: 700px) {
        header { right: 24px; }
        #profile { top: auto; right: 16px; bottom: 16px; }
      }
    </style>
  </head>
  <body>
    <main id="stage">
      <header>
        <h1>Terrain</h1>
        <p>Click anywhere. Points inside an obstacle land outside it.</p>
      </header>
      <section id="profile">
        <button type="button">Profile cached queries</button>
        <output>build and query counts\nfor this browser</output>
      </section>
      <div class="one" data-terrain-avoid>avoid</div>
      <div class="two" data-terrain-avoid>avoid</div>
      <div class="three" data-terrain-avoid>avoid</div>
      <div class="four" data-terrain-avoid>avoid</div>
      <div class="five" data-terrain-avoid>avoid</div>
      <div class="six" data-terrain-avoid>avoid</div>
      <canvas></canvas>
      <div id="actor"></div>
    </main>
    <script src="./terrain.min.js"></script>
    <script>
      const stage = document.querySelector("#stage");
      const canvas = stage.querySelector("canvas");
      const actor = stage.querySelector("#actor");
      const profile = stage.querySelector("#profile");
      const profileButton = profile.querySelector("button");
      const profileOutput = profile.querySelector("output");
      const context = canvas.getContext("2d");
      const edgeMargin = 24;
      stage.style.setProperty("--edge-margin", `${edgeMargin}px`);
      const terrain = new Terrain({
        viewport: () => stage.getBoundingClientRect(),
        edgeMargin,
        obstaclePadding: 8,
      });
      let start = { x: 48, y: 0 };
      let goal = { x: 0, y: 0 };
      let frame = 0;

      const draw = () => {
        frame = 0;
        const ratio = window.devicePixelRatio || 1;
        const width = stage.clientWidth;
        const height = stage.clientHeight;
        canvas.width = width * ratio;
        canvas.height = height * ratio;
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
        context.clearRect(0, 0, width, height);

        start = { x: 48, y: height - 48 };
        if (!goal.x && !goal.y) goal = { x: width - 56, y: 80 };
        terrain.build();
        const route = terrain.route(start, goal);
        if (!route) return;

        context.strokeStyle = "#087f5b";
        context.lineWidth = 4;
        context.lineJoin = "round";
        context.lineCap = "round";
        context.beginPath();
        context.moveTo(route[0].x, route[0].y);
        for (const point of route.slice(1)) context.lineTo(point.x, point.y);
        context.stroke();

        context.strokeStyle = "#d9480f";
        context.lineWidth = 2;
        context.beginPath();
        context.arc(goal.x, goal.y, 8, 0, 2 * Math.PI);
        context.stroke();

        const landed = route.at(-1);
        actor.style.transform = `translate(${landed.x}px, ${landed.y}px)`;
      };

      const schedule = () => {
        if (!frame) frame = requestAnimationFrame(draw);
      };

      const profileAt = (points, milliseconds) => {
        const result = {};
        const started = performance.now();
        let count = 0;
        let elapsed = 0;
        let checksum = 0;
        do {
          for (let batch = 0; batch < 256; batch++) {
            const point = points[count & 4095];
            checksum += terrain.at(point.x, point.y, result)?.d || 0;
            count++;
          }
          elapsed = performance.now() - started;
        } while (elapsed < milliseconds);
        return { count, elapsed, checksum };
      };

      const profileRoute = (points, milliseconds) => {
        const started = performance.now();
        let count = 0;
        let elapsed = 0;
        let checksum = 0;
        do {
          for (let batch = 0; batch < 32; batch++) {
            const route = terrain.route(
              points[count & 4095],
              points[(count * 17 + 31) & 4095],
            );
            checksum += route?.length || 0;
            count++;
          }
          elapsed = performance.now() - started;
        } while (elapsed < milliseconds);
        return { count, elapsed, checksum };
      };

      profile.addEventListener("pointerdown", (event) => event.stopPropagation());
      profileButton.addEventListener("click", async () => {
        profileButton.disabled = true;
        profileOutput.textContent = "profiling...";
        await new Promise(requestAnimationFrame);

        const builds = 25;
        const obstacles = terrain.avoidElements().length;
        const buildStarted = performance.now();
        for (let i = 0; i < builds; i++) terrain.build();
        const buildMs = (performance.now() - buildStarted) / builds;

        let random = 0x5eed1234;
        const points = Array.from({ length: 4096 }, () => {
          random = (1664525 * random + 1013904223) >>> 0;
          const x = (random / 0x100000000) * stage.clientWidth;
          random = (1664525 * random + 1013904223) >>> 0;
          const y = (random / 0x100000000) * stage.clientHeight;
          return { x, y };
        });
        const at = profileAt(points, 120);
        await new Promise(requestAnimationFrame);
        const route = profileRoute(points, 120);
        const rate = ({ count, elapsed }) =>
          Math.round((1000 * count) / elapsed).toLocaleString("en-US");
        if (!Number.isFinite(at.checksum + route.checksum))
          throw new Error("profile produced invalid output");
        profileOutput.textContent =
          `build()  ${buildMs.toFixed(3)} ms  (${obstacles} obstacles)\n` +
          `at()     ${rate(at)} calls/s  (${at.count.toLocaleString("en-US")})\n` +
          `route()  ${rate(route)} calls/s  (${route.count.toLocaleString("en-US")})`;
        profileButton.disabled = false;
      });

      stage.addEventListener("pointerdown", (event) => {
        const bounds = stage.getBoundingClientRect();
        goal = { x: event.clientX - bounds.left, y: event.clientY - bounds.top };
        schedule();
      });
      window.addEventListener("resize", schedule);
      schedule();
    </script>
  </body>
</html>
