<!DOCTYPE html>
<html lang='en'>
  <head>
    <title>beef wife</title>
    <meta charset='utf-8'>
    <style>
      * {
        transition: all 150ms ease-in-out;
      }
      body {
        font-family: "Arial Narrow", sans-serif;
        background-color: #8bcf01;
        color: #000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      canvas.beefwives {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }
      div.beef-wife, a.lab {
        position: relative;
      }
      div.beef-wife {
        font-size: 150pt;
        text-align: center;
        text-shadow: 
          1px 1px 0 rgba(0,0,255,0.5),
          -1px -1px 0 rgba(255,0,0,0.5);
        filter: 
          blur(2px)
          contrast(150%)
          brightness(120%)
          saturate(200%);

      }
      a.lab {
        font-size: 24pt;
        color: #000;
        text-decoration: none;
        border-bottom: 2px solid transparent;
      }
      a.lab:hover {
        border-bottom-color: #000;
      }
    </style>
  </head>
  <body>
    <canvas
      class="beefwives"
      data-beefwife-canvas
      data-beefwife-sources="samples/the-worm.json, samples/raccoon.json"
      data-beefwife-resolution-scale="0.75"
      data-beefwife-image-rendering="pixelated"
    ></canvas>
    <div class="beef-wife">
      beef<br/>wife
    </div>
    <a class="lab" href="lab/">Enter the lab</a>
    <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.23.0/dist/pixi.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@kvmet/beefwife-canvas@0.2.1/beefwife-canvas.min.js"></script>
  </body>
</html>
