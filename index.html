<!DOCTYPE html>
<html lang='en'>
  <head>
    <title>beef wife</title>
    <meta charset='utf-8'>
    <style>
      * {
        transition: all 150ms ease-in-out;
      }
      body {
        font-family: "Arial Narrow", sans-serif;
        background-color: #8bcf01;
        color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      div.beef-wife {
        font-size: 150pt;
        text-align: center;
        text-shadow: 
          1px 1px 0 rgba(0,0,255,0.5),
          -1px -1px 0 rgba(255,0,0,0.5);
        filter: 
          blur(2px)
          contrast(150%)
          brightness(120%)
          saturate(200%);

      }
    </style>
  </head>
  <body>
    <div class="beef-wife">
      beef<br/>wife
    </div>
  </body>
</html>
